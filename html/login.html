<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boupetique</title>
    <link rel="icon" type="image/png" href="../assets/logo-img/pinguino.png">

    <!-- Iconos-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Conexión de BootStrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-page="login">

    <header id="site-header">
        <div data-include="../partials/navbar.html"></div>
        <div class="techo-banner"></div>
    </header>

    <main class="flex-grow-1 d-flex flex-column align-items-center justify-content-center p-3">
    <!-- cajita de login -->
    <div class="glass-card w-100 p-4 p-sm-5 d-flex flex-column align-items-center shadow-lg">
      
      <!-- piwilogo -->
      <div class="logo-badge d-flex align-items-center justify-content-center mb-4 shadow">
        <img
          src="../assets/logo-img/pinguino.png"
          alt="Boupetique"
        />
      </div>

      <h2 class="h4 fw-semibold text-white mb-4 text-center">Boupetique</h2>

      <!-- Formulario aún no hace nada solo es la parte visual-->
      <form id="signInForm" class="w-100 d-flex flex-column gap-3" novalidate>
        <div class="d-flex flex-column gap-3">
          <input
            id="emailInput"
            type="email"
            class="form-control custom-input"
            placeholder="Correo electrónico"
            required
          />
          <input
            id="passwordInput"
            type="password"
            class="form-control custom-input"
            placeholder="Contraseña"
            required
          />
        </div>
        <hr class="my-2 border-secondary opacity-25" />

        <div>
          <button type="submit" class="btn btn-custom-signin w-100 mb-3 shadow-sm">
            Iniciar sesión
          </button>
        </div>
      </form>

      <!-- perritos y gatitos como se sugirió -->
      <div class="mt-3 pt-2 d-flex flex-column align-items-center text-center">
        <p class="text-white-50 small mb-2">
          Bienvenido a nuestra gran familia Boupetique.
        </p>
        <div class="avatar-stack">
          <img src="../assets/sally.jpg" alt="fer" />
          <img src="../assets/ares.jpg" alt="zayra" />
          <img src="../assets/pepillo.jpg" alt="sebas" />
          <img src="../assets/morita.jpg" alt="olan" />
          <img src="../assets/chester.jpg" alt="jaime" />
          <img src="../assets/gandalf.jpg" alt="liz" />
          <img src="../assets/canela.jpg" alt="dayana" />
        </div>
      </div>

    </div>
  </main>

  <footer id="site-footer" class="text-light py-5" data-include="../partials/footer.html"></footer>

  <!-- Scripts -->
  <script src="../js/app.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
  <!-- Script de Contador de Productos -->
  <script type="module" src="../js/productos/counterProducts.js"></script>
</body>
</html>
