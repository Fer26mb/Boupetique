<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boupetique - Iniciar sesión</title>
    <link rel="icon" type="image/png" href="../assets/logo-img/pinguino.png">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Conexión de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/Registro.css">
</head>

<body data-page="login">
  
    <header id="site-header">
        <div data-include="../partials/navbar.html"></div>
        <div class="techo-banner"></div>
    </header>

    <main class="flex-grow-1 d-flex flex-column align-items-center p-3">
        <div class="auth-toggle-container" role="tablist">
            <button type="button" class="toggle-btn active" data-auth-tab="login" role="tab"
                aria-controls="panelLogin" aria-selected="true">Iniciar sesión</button>
            <button type="button" class="toggle-btn" data-auth-tab="registro" role="tab"
                aria-controls="panelRegistro" aria-selected="false">Registrarme</button>
        </div>

        <!-- Cajita de login -->
        <section id="panelLogin" class="auth-panel w-100" role="tabpanel">
        <div class="glass-card w-100 mx-auto p-4 p-sm-5 d-flex flex-column align-items-center shadow-lg">
            
            <!-- Contenedor para Alertas de Bootstrap -->
            <div id="alertContainer" class="w-100 mb-3"></div>

            <!-- Logo Badge -->
            <div class="logo-badge d-flex align-items-center justify-content-center mb-4 shadow">
                <img src="../assets/logo-img/pinguino.png" alt="Boupetique" />
            </div>

            <h2 class="h4 fw-semibold text-white mb-4 text-center">Boupetique</h2>

            <!-- Formulario de Iniciar Sesión -->
            <form id="signInForm" class="w-100 d-flex flex-column gap-3" novalidate>
                <div class="d-flex flex-column gap-3">
                    <div>
                        <input
                            id="emailInput"
                            type="email"
                            class="form-control custom-input"
                            autocomplete="username"
                            placeholder="Correo electrónico"
                            required
                        />
                    </div>

                    <div class="position-relative w-100">
                        <input
                            id="passwordInput"
                            type="password"
                            class="form-control custom-input w-100"
                            placeholder="Contraseña"
                            style="padding-right: 45px !important;"
                            autocomplete="current-password"
                            required
                        />
                        <!-- Botón Ojito -->
                        <button
                            type="button"
                            id="togglePassword"
                            class="btn position-absolute top-50 end-0 translate-middle-y text-white-50 border-0 bg-transparent"
                            style="right: 10px; z-index: 10; padding: 5px; cursor: pointer;"
                            tabindex="-1"
                            aria-label="Mostrar u ocultar contraseña"
                        >
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="rgb(217, 107, 39)" viewBox="0 0 16 16">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-8.837 8.212-6.633 8.212s-6.298-7.732-6.633-8.212A13 13 0 0 1 1.173 8"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <hr class="my-2 border-secondary opacity-25" />

                <div>
                    <button type="submit" class="btn btn-custom-signin w-100 mb-3 shadow-sm">
                        Iniciar sesión
                    </button>
                </div>

                <p class="text-center text-white-50 small mb-0">
                    ¿No tienes una cuenta? 
                    <a href="login.html?modo=registro" data-auth-switch="registro" class="text-white fw-semibold text-decoration-none">Regístrate</a>
                </p>
            </form>

            <!-- Sección de Mascotas -->
            <div class="mt-3 pt-2 d-flex flex-column align-items-center text-center">
                <p class="text-white-50 small mb-2">
                    Bienvenido a nuestra gran familia Boupetique.
                </p>
                <div class="avatar-stack">
                    <img src="../assets/sally.jpg" alt="fer" />
                    <img src="../assets/ares.jpg" alt="zayra" />
                    <img src="../assets/pepillo.jpg" alt="sebas" />
                    <img src="../assets/morita.jpg" alt="olan" />
                    <img src="../assets/chester.jpg" alt="jaime" />
                    <img src="../assets/gandalf.jpg" alt="liz" />
                    <img src="../assets/canela.jpg" alt="dayana" />
                </div>
            </div>

        </div>
        </section>

        <section id="panelRegistro" class="auth-panel w-100" role="tabpanel" hidden>
            <div class="row justify-content-center g-0">
                <div class="col-12 col-md-10 col-lg-7 col-xl-6">
                    <div class="form registro-card p-4 p-sm-5 shadow-lg">
                        <form id="formulario" action="#" method="POST" novalidate>
                        <p class="titleR">Registro </p>
                        <p class="messageR">Registrate y obten grandes beneficios para ti y tu mascotita </p>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    placeholder="Escribe tu nombre" required>

                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="apellido" class="form-label">Apellidos </label>
                                <input type="text" class="form-control" id="apellido" name="apellido"
                                    placeholder="Escribe tus apellidos" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label">Teléfono </label>
                                <input type="tel" class="form-control" id="telefono" name="telefono"
                                    placeholder="Escribe tu número..." required>

                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="correo" class="form-label">Correo</label>
                                <input type="email" class="form-control" id="correo" name="correo"
                                    placeholder="Boupetique@gmail.com">
                            </div>
                        </div>
                        <p class="titleF">Indica fecha de nacimiento </p>
                        <div class="row">
                            <div class="col-md-4 mb-3 mx-auto">
                                <label for="anio" class="form-label">Año</label>
                                <select class="form-select" id="anio" name="anio" required>
                                    <option value="" disabled selected>Año...</option>
                                    <option value="2008">2008</option>
                                    <option value="2007">2007</option>
                                    <option value="2006">2006</option>
                                    <option value="2005">2005</option>
                                    <option value="2004">2004</option>
                                    <option value="2003">2003</option>
                                    <option value="2002">2002</option>
                                    <option value="2001">2001</option>
                                    <option value="2000">2000</option>
                                    <option value="1999">1999</option>
                                    <option value="1998">1998</option>
                                    <option value="1997">1997</option>
                                    <option value="1996">1996</option>
                                    <option value="1995">1995</option>
                                    <option value="1994">1994</option>
                                    <option value="1993">1993</option>
                                    <option value="1992">1992</option>
                                    <option value="1991">1991</option>
                                    <option value="1990">1990</option>
                                    <option value="1989">1989</option>
                                    <option value="1988">1988</option>
                                    <option value="1987">1987</option>
                                    <option value="1986">1986</option>
                                    <option value="1985">1985</option>
                                    <option value="1984">1984</option>
                                    <option value="1983">1983</option>
                                    <option value="1982">1982</option>
                                    <option value="1981">1981</option>
                                    <option value="1980">1980</option>
                                    <option value="1979">1979</option>
                                    <option value="1978">1978</option>
                                    <option value="1977">1977</option>
                                    <option value="1976">1976</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3 mx-auto">
                                <label for="mes" class="form-label">Mes </label>
                                <select class="form-select" id="mes" name="mes" required>
                                    <option value="" disabled selected>Mes...</option>
                                    <option value="Enero">Enero</option>
                                    <option value="Febrero">Febrero</option>
                                    <option value="Marzo">Marzo</option>
                                    <option value="Abril">Abril</option>
                                    <option value="Mayo">Mayo</option>
                                    <option value="Junio">Junio</option>
                                    <option value="Julio">Julio</option>
                                    <option value="Agosto">Agosto</option>
                                    <option value="Septiembre">Septiembre</option>
                                    <option value="Octubre">Octubre</option>
                                    <option value="Noviembre">Noviembre</option>
                                    <option value="Diciembre">Diciembre</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3 mx-auto">
                                <label for="dia" class="form-label">Día </label>
                                <select class="form-select" id="dia" name="dia" required>
                                    <option value="" disabled selected>Día...</option>
                                    <option value="01">01</option>
                                    <option value="02">02</option>
                                    <option value="03">03</option>
                                    <option value="04">04</option>
                                    <option value="05">05</option>
                                    <option value="06">06</option>
                                    <option value="07">07</option>
                                    <option value="08">08</option>
                                    <option value="09">09</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                    <option value="13">13</option>
                                    <option value="14">14</option>
                                    <option value="15">15</option>
                                    <option value="16">16</option>
                                    <option value="17">17</option>
                                    <option value="18">18</option>
                                    <option value="19">19</option>
                                    <option value="20">20</option>
                                    <option value="21">21</option>
                                    <option value="22">22</option>
                                    <option value="23">23</option>
                                    <option value="24">24</option>
                                    <option value="25">25</option>
                                    <option value="26">26</option>
                                    <option value="27">27</option>
                                    <option value="28">28</option>
                                    <option value="29">29</option>
                                    <option value="30">30</option>
                                    <option value="31">31</option>
                                </select>
                            </div>
                            </div>


                            <div class="row mt-3">
                                <p class="titleF">Datos de tu mascota</p>
                                <div class="col-md-6 mb-3">
                                    <label for="mascota" class="form-label">Nombre de tu mascota </label>
                                    <input type="text" class="form-control" id="mascota" name="mascota"
                                        placeholder="Morita..." autocomplete="off" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="tipomascota" class="form-label"> Tipo de mascota </label>
                                    <select class="form-select" id="tipomascota" name="tipomascota" required>
                                        <option value="" disabled selected>Selecciona tu mascota...</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="tamano" class="form-label">Tamaño de tu mascota </label>
                                    <select class="form-select" id="tamano" name="tamano" required>
                                        <option value="" disabled selected>Tamaño...</option>
                                        <option value="Minis">Minis</option>
                                        <option value="Pequeña">Pequeña</option>
                                        <option value="Mediana">Mediana</option>
                                        <option value="Grande">Grande</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="peso" class="form-label"> Peso </label>
                                    <select class="form-select" id="peso" name="peso" required>
                                        <option value="" disabled selected>Peso...</option>
                                        <option value="Entre 1 kg y 3 kg">Entre 1 kg y 3 kg</option>
                                        <option value="Entre 3 kg y 10 kg">Entre 3 kg y 10 kg</option>
                                        <option value="Entre 10 kg y 25 kg">Entre 10 kg y 25 kg</option>
                                        <option value="Entre 25 kg y 45 kg">Entre 25 kg y 45 kg</option>
                                        <option value="Más de 45 kg">Más de 45 kg</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-12 mb-2">
                                <label for="edadm" class="form-label">Edad de tu mascota </label>
                                <select class="form-select" id="edadm" name="edadm" required>
                                    <option value="" disabled selected>Edad...</option>
                                    <option value="Menos de 1 año">Menos de 1 año</option>
                                    <option value="Entre 1 y 2 años">Entre 1 y 2 años</option>
                                    <option value="Entre 2 y 3 años">Entre 2 y 3 años</option>
                                    <option value="Entre 3 y 4 años">Entre 3 y 4 años</option>
                                    <option value="Entre 4 y 5 años">Entre 4 y 5 años</option>
                                    <option value="Entre 5 y 6 años">Entre 5 y 6 años</option>
                                    <option value="Entre 6 y 7 años">Entre 6 y 7 años</option>
                                    <option value="Entre 7 y 8 años">Entre 7 y 8 años</option>
                                    <option value="Entre 8 y 9 años">Entre 8 y 9 años</option>
                                    <option value="Entre 9 y 10 años">Entre 9 y 10 años</option>
                                    <option value="Más de 10 años">Más de 10 años</option>
                                </select>
                            </div> 


                            <div class="row mt-3">
                                <div class="col-md-6 mb-4">

                                    <label for="contrasena" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="contrasena" name="contrasena"
                                        rows="1" placeholder="Nueva contraseña..." autocomplete="new-password" required>
                                    <div class="d-flex justify-content-between mt-1">
                                        <div class="invalid-feedback d-block">
                                        </div>
                                        <small id="contador">
                                            mínimo 8
                                        </small>
                                    </div>
                                    <div class="check-text text-success mt-1" id="checkMensaje" style="display: none;">
                                        ✓ Ok
                                    </div>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="repcontrasena" class="form-label">Repite tu Contraseña</label>
                                    <input type="password" class="form-control" id="repcontrasena" name="repcontrasena"
                                        rows="1" placeholder="Repite tu contraseña..." autocomplete="new-password"
                                        required>
                                    <div class="d-flex justify-content-between mt-1">
                                        <div class="invalid-feedback d-block">

                                        </div>
                                        <small id="repcontador">
                                            mínimo 8
                                        </small>
                                    </div>
                                    <div class="check-text text-success mt-1" id="checkMensajeRep"
                                        style="display: none;">
                                        ✓ Ok
                                    </div>
                                </div>
                            </div>
                            <div class="form-group form-check">
                                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                <label class="form-check-label" for="exampleCheck1">Acepta <a href="#"
                                        id="terminosLink">terminos y condiciones </a> 
                                </label>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="reset" class="btn btn-secondary w-50">
                                    Limpiar
                                </button>
                                <button type="submit" class="btn btn-success w-50" id="btnEnviar" disabled>
                                    Crear mi cuenta
                                </button>
                            </div>
                            <p class="text-center text-white-50 small mt-3 mb-0">
                                ¿Ya tienes cuenta?
                                <a href="login.html" data-auth-switch="login" class="text-white fw-semibold text-decoration-none">Inicia sesión</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="text-light py-5" data-include="../partials/footer.html"></footer>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/login.js"></script>
    <script src="../js/scriptRegis.js"></script>
</body>

</html>
