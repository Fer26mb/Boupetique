<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boupetique - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="../assets/logo-img/pinguino.png">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Conexión de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-page="login">
  
    <header id="site-header">
        <div data-include="../partials/navbar.html"></div>
        <div class="techo-banner"></div>
    </header>

            <div class="text-center mb-4">
              <!--  <span class="text-uppercase fw-bold">Registro de Cuenta</span>
                <h1 class="fw-bold my-2"></h1>
                <p class="text-muted lead mx-auto" style="max-width: 600px;">
                    Registrate para obtener descuentos, venta de nuevos productos y más... antes que nadie..es gratis.
                </p> -->
                <p class="signin">¿Ya tienes cuenta ? <a href="/html/login.html"></a> </p>
            </div>

<div class="auth-toggle-container">
  <!-- Tipo Petco Toggle-->
  <a href="login.html" class="toggle-btn active">Iniciar sesión</a>
  <!-- Tipo petco -->
  <a href="registro.html" class="toggle-btn">Registrarme</a>
</div>

    <main class="flex-grow-1 d-flex flex-column align-items-center justify-content-center p-3">
        <!-- Cajita de login -->
        <div class="glass-card w-100 p-4 p-sm-5 d-flex flex-column align-items-center shadow-lg">
            
            <!-- Contenedor para Alertas de Bootstrap -->
            <div id="alertContainer" class="w-100 mb-3"></div>

            <!-- Logo Badge -->
            <div class="logo-badge d-flex align-items-center justify-content-center mb-4 shadow">
                <img src="../assets/logo-img/pinguino.png" alt="Boupetique" />
            </div>

            <h2 class="h4 fw-semibold text-white mb-4 text-center">Boupetique</h2>

            <!-- Formulario de Iniciar Sesión -->
            <form id="signInForm" class="w-100 d-flex flex-column gap-3" novalidate>
                <div class="d-flex flex-column gap-3">
                    <div>
                        <input
                            id="emailInput"
                            type="email"
                            class="form-control custom-input"
                            autocomplete="username"
                            placeholder="Correo electrónico"
                            required
                        />
                    </div>

                    <div class="position-relative w-100">
                        <input
                            id="passwordInput"
                            type="password"
                            class="form-control custom-input w-100"
                            placeholder="Contraseña"
                            style="padding-right: 45px !important;"
                            autocomplete="current-password"
                            required
                        />
                        <!-- Botón Ojito -->
                        <button
                            type="button"
                            id="togglePassword"
                            class="btn position-absolute top-50 end-0 translate-middle-y text-white-50 border-0 bg-transparent"
                            style="right: 10px; z-index: 10; padding: 5px; cursor: pointer;"
                            tabindex="-1"
                            aria-label="Mostrar u ocultar contraseña"
                        >
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="rgb(217, 107, 39)" viewBox="0 0 16 16">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-8.837 8.212-6.633 8.212s-6.298-7.732-6.633-8.212A13 13 0 0 1 1.173 8"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <hr class="my-2 border-secondary opacity-25" />

                <div>
                    <button type="submit" class="btn btn-custom-signin w-100 mb-3 shadow-sm">
                        Iniciar sesión
                    </button>
                </div>

                <p class="text-center text-white-50 small mb-0">
                    ¿No tienes una cuenta? 
                    <a href="registro.html" class="text-white fw-semibold text-decoration-none">Regístrate</a>
                </p>
            </form>

            <!-- Sección de Mascotas -->
            <div class="mt-3 pt-2 d-flex flex-column align-items-center text-center">
                <p class="text-white-50 small mb-2">
                    Bienvenido a nuestra gran familia Boupetique.
                </p>
                <div class="avatar-stack">
                    <img src="../assets/sally.jpg" alt="fer" />
                    <img src="../assets/ares.jpg" alt="zayra" />
                    <img src="../assets/pepillo.jpg" alt="sebas" />
                    <img src="../assets/morita.jpg" alt="olan" />
                    <img src="../assets/chester.jpg" alt="jaime" />
                    <img src="../assets/gandalf.jpg" alt="liz" />
                    <img src="../assets/canela.jpg" alt="dayana" />
                </div>
            </div>

        </div>
    </main>

    <footer id="site-footer" class="text-light py-5" data-include="../partials/footer.html"></footer>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/productos/counterProducts.js"></script>
    <!-- Script de Validaciones y LocalStorage para Login -->
    <script src="../js/login.js"></script>
</body>

</html>
